name: fly_narwhal
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_driver:
    sdk: flutter
  cupertino_icons: ^1.0.8
  
  # UI
  fluent_ui: ^4.13.0
  flutter_acrylic: ^1.1.4
  cached_network_image: ^3.3.1
  flutter_cache_manager: ^3.4.1
  system_info2: ^4.0.0
  window_manager: ^0.3.9
  
  # State Management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5
  
  # Networking
  dio: ^5.4.3
  talker: ^5.1.17
  talker_dio_logger: ^5.1.17
  talker_flutter: ^5.1.17
  
  # Navigation
  go_router: ^14.2.0
  url_launcher: ^6.2.4
  
  # Serialization
  json_annotation: ^4.9.0
  
  # Storage
  shared_preferences: ^2.2.3
  flutter_svg: ^2.2.3
  path_provider: ^2.1.2
  path: ^1.8.3
  file_selector: ^1.0.3
  crypto: ^3.0.7
  cryptography: ^2.7.0
  flutter_inappwebview: ^5.7.2
  webview_windows: ^0.4.0
  
  # Video Player
  media_kit: ^1.1.10
  media_kit_video: ^1.2.4
  media_kit_libs_video: ^1.0.4
  
  # Animation
  lottie: ^3.1.0
  desktop_multi_window: ^0.3.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.4.9
  riverpod_generator: ^2.4.0
  json_serializable: ^6.8.0
  mocktail: ^1.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/lottie/
