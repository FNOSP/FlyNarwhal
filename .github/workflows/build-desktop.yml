name: Build Desktop Releases

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            platform: windows
            architecture: x64
            goarch: amd64
            libname: fly_narwhal_obfuscator.dll
            artifact: windows-x64
          - runner: windows-11-arm
            platform: windows
            architecture: arm64
            goarch: arm64
            libname: fly_narwhal_obfuscator.dll
            artifact: windows-arm64
          - runner: macos-15-intel
            platform: macos
            architecture: x64
            goarch: amd64
            libname: libfly_narwhal_obfuscator.dylib
            artifact: macos-x64
          - runner: macos-14
            platform: macos
            architecture: arm64
            goarch: arm64
            libname: libfly_narwhal_obfuscator.dylib
            artifact: macos-arm64
          - runner: ubuntu-24.04
            platform: linux
            architecture: x64
            goarch: amd64
            libname: libfly_narwhal_obfuscator.so
            artifact: linux-x64
          - runner: ubuntu-24.04-arm
            platform: linux
            architecture: arm64
            goarch: arm64
            libname: libfly_narwhal_obfuscator.so
            artifact: linux-arm64
    runs-on: ${{ matrix.runner }}
    environment: release
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Probe Go toolchain
        id: probe-go
        shell: pwsh
        run: |
          $requiredVersion = (Get-Content updater/go.mod | Where-Object { $_ -match '^go\s+([0-9.]+)$' } | Select-Object -First 1) -replace '^go\s+', ''
          if (-not $requiredVersion) {
            throw 'Unable to determine required Go version from updater/go.mod'
          }
          $goCommand = Get-Command go -ErrorAction SilentlyContinue
          $needsSetup = $true
          if ($goCommand) {
            $versionOutput = & go version
            Write-Host "Existing Go toolchain: $versionOutput"
            if ($versionOutput -match 'go([0-9]+\.[0-9]+(?:\.[0-9]+)?)') {
              $installedVersion = [version]$matches[1]
              if ($installedVersion -ge ([version]$requiredVersion)) {
                $needsSetup = $false
              }
            }
          } else {
            Write-Host 'Go is not preinstalled on this runner.'
          }
          "needs_setup=$($needsSetup.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT

      - name: Set up Go
        if: steps.probe-go.outputs.needs_setup == 'true'
        uses: actions/setup-go@v5
        with:
          go-version-file: updater/go.mod
          check-latest: true

      - name: Verify Go toolchain
        shell: pwsh
        run: go version

      - name: Set up C toolchain (Linux)
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc mpv libmpv-dev
          # Verify the runtime libmpv can decode PGS/HDMV SUP subtitles so the
          # bundle script can rely on the system copy. mpv is built against
          # FFmpeg, so `mpv --list-options` exposes decoder availability.
          ffmpeg_decoders="$(ffmpeg -decoders 2>/dev/null || true)"
          if [ -z "$ffmpeg_decoders" ]; then
            sudo apt-get install -y ffmpeg
          fi
          if ! ffmpeg -decoders 2>/dev/null | grep -q 'hdmv_pgs_subtitle'; then
            echo '::error::Installed ffmpeg/mpv does not expose hdmv_pgs_subtitle; cannot bundle a full libmpv for PGS/HDMV SUP support.'
            ffmpeg -decoders | head -20 || true
            exit 1
          fi

      - name: Set up C toolchain (Windows arm64)
        if: matrix.platform == 'windows' && matrix.architecture == 'arm64'
        shell: pwsh
        run: |
          Write-Host 'The windows-11-arm runner must provide an ARM64 MSVC or LLVM-MinGW C toolchain.'

      - name: Check out verified private obfuscator
        uses: actions/checkout@v4
        with:
          repository: Jankin-Wu/fly-narwhal-obfuscator
          # ref: ${{ vars.OBFUSCATOR_RELEASE_TAG }}
          token: ${{ secrets.OBFUSCATOR_REPO_TOKEN }}
          path: .private/obfuscator
          persist-credentials: false
          fetch-depth: 1

      # - name: Verify private obfuscator revision
      #   shell: bash
      #   run: |
      #     test -n "${{ vars.OBFUSCATOR_EXPECTED_SHA }}"
      #     test "$(git -C .private/obfuscator rev-parse HEAD)" = "${{ vars.OBFUSCATOR_EXPECTED_SHA }}"

      - name: Build protected release bundle
        env:
          FLY_NARWHAL_API_SECRET: ${{ secrets.FLY_NARWHAL_API_SECRET }}
          FLY_NARWHAL_SECRET: ${{ secrets.FLY_NARWHAL_SECRET }}
          REPORT_URL: ${{ secrets.REPORT_URL }}
          REPORT_API_SECRET: ${{ secrets.REPORT_API_SECRET }}
          OBFUSCATOR_TOOL_DIRECTORY: ${{ github.workspace }}/.private/obfuscator
          OBFUSCATOR_GOARCH: ${{ matrix.goarch }}
          OBFUSCATOR_LIBNAME: ${{ matrix.libname }}
        run: dart run scripts/release/build_desktop.dart ${{ matrix.platform }} ${{ matrix.architecture }}

      - name: Run updater tests
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          Set-Location updater
          go test ./...

      - name: Package Windows installer
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          $version = (Select-String -Path pubspec.yaml -Pattern '^version:\s*([^+]+)').Matches[0].Groups[1].Value
          iscc "/DMyAppArch=${{ matrix.goarch }}" "/DMyAppVersion=$version" "/DFlutterBundleDir=$PWD\\build\\windows\\${{ matrix.architecture }}\\runner\\Release" installer/setup.iss

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            build/installer/FlyNarwhal_Setup_Windows_*.exe
            build/macos/Build/Products/Release/*.dmg
            dist/**/*
          if-no-files-found: error

      - name: Remove private build material
        if: always()
        shell: bash
        run: rm -rf .private generated-obfuscator

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate checksums
        shell: bash
        run: |
          cd artifacts
          sha256sum * > SHA256SUMS

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
